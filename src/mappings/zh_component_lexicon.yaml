  FORWARD COLLISION AVOIDANCE:
    zh_label: "前向碰撞避免/自动紧急制动"
    keywords: ["防撞", "碰撞预警", "主动刹车", "紧急制动", "aeb", "AEB", "雷达", "自适应巡航", "acc", "ACC", "毫米波"]
  LANE DEPARTURE:
    zh_label: "车道偏离"
    keywords: ["车道偏离", "车道保持", "lkas", "LKAS", "盲区", "并线辅助"]
  BACK OVER PREVENTION:
    zh_label: "倒车防撞/后视"
    keywords: ["倒车影像", "倒车雷达", "摄像头", "后视影像", "360影像"]
  VEHICLE SPEED CONTROL:
    zh_label: "车速控制"
    keywords: ["定速巡航", "巡航", "油门踏板", "油门", "车速", "限速", "加速"]
  EQUIPMENT:
    zh_label: "空调/附属设备"
    keywords: ["空调", "压缩机", "制冷", "暖风", "鼓风机", "冷凝器", "蒸发箱", "冷媒", "氟利昂", "出风口"]
