id: https://w3id.org/poc-kb/catalog
name: poc_kb_v3
title: Automotive After-Sales Knowledge Base Ontology (Modular v3.0-exp)
version: 3.0.0-exp
license: https://www.apache.org/licenses/LICENSE-2.0
description: >-
  Top-level catalog schema importing all modular LinkML v3 schemas:
  core, recall, diagnostics, inspection, signal, and ev_battery.
prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/poc-kb/core/
imports:
  - prefixes
  - linkml:types
  - metadata
  - core
  - recall
  - diagnostics
  - inspection
  - signal
  - ev_battery
default_prefix: core
default_range: string
